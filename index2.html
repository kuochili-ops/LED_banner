<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>白六 LED 跑馬燈</title>
    <style>
        :root { --bg-color: #000; --panel-bg: #1a1a1a; --accent-blue: #007AFF; --accent-red: #ff3b30; --accent-green: #34c759; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; color: #fff; }
        body { display: flex; flex-direction: column; }
        
        /* 16:9 顯示區域 */
        #display-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #000; }
        canvas { aspect-ratio: 16 / 9; width: 100% !important; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
        
        /* 下載彈窗 */
        #download-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #222; padding: 30px; border-radius: 20px; text-align: center; max-width: 320px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* 控制面板 */
        #controls { background: var(--panel-bg); padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; overflow-y: auto; max-height: 55%; }
        @media (orientation: landscape) { #controls { display: none; } }
        
        .section-title { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -4px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-blue); }
        
        .btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--accent-blue); color: white; font-weight: 600; cursor: pointer; text-align: center; font-size: 14px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        #recordBtn { background: var(--accent-red); min-width: 80px; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #900; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 15px; font-size: 11px; color: #aaa; }
        .setting-item { display: flex; flex-direction: column; gap: 6px; }
        input[type="range"] { width: 100%; accent-color: var(--accent-blue); cursor: pointer; }
        
        .image-tools { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px dashed #444; }
    </style>
</head>
<body>

<div id="display-container">
    <canvas id="ledCanvas"></canvas>
    
    <div id="download-overlay">
        <div class="modal">
            <h2 style="margin:0 0 10px 0; color:var(--accent-green);">白六 LED</h2>
            <p style="color:#aaa; font-size:14px; margin-bottom:20px;">16:9 跑馬燈影片製作完成</p>
            <button id="manualDownloadBtn" class="btn" style="width:100%; margin-bottom:12px; background:var(--accent-green); height:50px; font-size:16px;">下載 MP4 影片</button>
            <button onclick="closeModal()" style="background:none; color:#666; text-decoration:none; border:none; font-size:13px;">關閉窗口</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="section-title">文字內容</div>
    <div class="input-row">
        <input type="text" id="textInput" placeholder="輸入文字..." value="白六 LED 跑馬燈 ❤️ 🚁">
        <button class="btn" onclick="updateText()">更新</button>
        <button id="recordBtn" class="btn" onclick="toggleRecording()">錄影</button>
    </div>

    <div class="section-title">圖片插入與位置</div>
    <div class="image-tools">
        <div class="input-row" style="margin-bottom:10px;">
            <label class="btn" style="flex:1; background:#333;">選擇圖片<input type="file" id="imageInput" accept="image/*" hidden onchange="handleImage(this)"></label>
            <button class="btn" style="background:#222; color:#888;" onclick="resetImage()">清除</button>
        </div>
        <div class="settings-grid">
            <div class="setting-item"><label>圖片縮放</label><input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1" oninput="updateSettings()"></div>
            <div class="setting-item"><label>左右位移 (X)</label><input type="range" id="imgX" min="-300" max="300" value="0" oninput="updateSettings()"></div>
            <div class="setting-item"><label>上下位移 (Y)</label><input type="range" id="imgY" min="-150" max="150" value="0" oninput="updateSettings()"></div>
        </div>
    </div>

    <div class="section-title">點陣參數</div>
    <div class="settings-grid">
        <div class="setting-item"><label>滾動速度</label><input type="range" id="speedRange" min="0" max="40" value="20" oninput="updateSettings()"></div>
        <div class="setting-item"><label>點陣密度</label><input type="range" id="pixelRange" min="40" max="120" value="70" oninput="updateSettings()"></div>
        <div class="setting-item"><label>燈珠顏色</label><input type="color" id="colorPicker" value="#00ff00" onchange="updateSettings()" style="width:100%; border:none; background:none; height:28px; padding:0;"></div>
        <div class="setting-item"><label>燈珠大小</label><input type="range" id="sizeRange" min="0.2" max="1" step="0.05" value="0.75" oninput="updateSettings()"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('ledCanvas'), ctx = canvas.getContext('2d', { alpha: false });
    const textInput = document.getElementById('textInput'), recordBtn = document.getElementById('recordBtn');
    const overlay = document.getElementById('download-overlay'), manualBtn = document.getElementById('manualDownloadBtn');

    const V_WIDTH = 1280, V_HEIGHT = 720;
    let settings = { 
        text: textInput.value, density: 70, dotScale: 0.75, color: "#00ff00", speed: 20, offset: V_WIDTH,
        img: null, imgScale: 1.0, imgX: 0, imgY: 0
    };
    
    const offscreen = document.createElement('canvas'), octx = offscreen.getContext('2d');
    const maskCanvas = document.createElement('canvas'), mctx = maskCanvas.getContext('2d');
    let mediaRecorder, recordedChunks = [], isRecording = false;

    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => { settings.img = img; renderBuffer(); settings.offset = V_WIDTH; };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function resetImage() { settings.img = null; renderBuffer(); }

    function updateSettings() {
        settings.speed = parseInt(document.getElementById('speedRange').value);
        settings.density = parseInt(document.getElementById('pixelRange').value);
        settings.dotScale = parseFloat(document.getElementById('sizeRange').value);
        settings.color = document.getElementById('colorPicker').value;
        settings.imgScale = parseFloat(document.getElementById('imgScale').value);
        settings.imgX = parseInt(document.getElementById('imgX').value);
        settings.imgY = parseInt(document.getElementById('imgY').value);
        renderBuffer();
    }

    function updateText() { settings.text = textInput.value; renderBuffer(); settings.offset = V_WIDTH; }

    function renderBuffer() {
        const h = settings.density;
        const fontSize = h * 0.85; 
        octx.font = `bold ${fontSize}px sans-serif`;
        let textMetrics = octx.measureText(settings.text);
        let imgDrawWidth = 0;
        let contentWidth = textMetrics.width + 100;

        if (settings.img) {
            const aspect = settings.img.width / settings.img.height;
            imgDrawWidth = h * aspect * settings.imgScale;
            contentWidth += imgDrawWidth + 50 + Math.abs(settings.imgX);
        }

        offscreen.width = maskCanvas.width = contentWidth;
        offscreen.height = maskCanvas.height = h;

        octx.clearRect(0, 0, contentWidth, h);
        mctx.clearRect(0, 0, contentWidth, h);

        let currentX = 50;
        if (settings.img) {
            const drawH = h * settings.imgScale;
            octx.drawImage(settings.img, currentX + settings.imgX, (h - drawH) / 2 + settings.imgY, imgDrawWidth, drawH);
            currentX += imgDrawWidth + 50;
        }

        octx.textBaseline = mctx.textBaseline = "middle";
        octx.font = mctx.font = `bold ${fontSize}px sans-serif`;
        octx.fillStyle = "white"; 
        octx.fillText(settings.text, currentX, h / 2);
        mctx.fillStyle = "#FF00FF"; 
        mctx.fillText(settings.text, currentX, h / 2);

        canvas.width = V_WIDTH; canvas.height = V_HEIGHT; 
    }

    function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const imgData = octx.getImageData(0, 0, offscreen.width, offscreen.height).data;
        const maskData = mctx.getImageData(0, 0, maskCanvas.width, maskCanvas.height).data;
        
        const step = V_HEIGHT / settings.density;
        const dotSize = step * settings.dotScale;
        const targetColor = hexToRgb(settings.color);

        for (let y = 0; y < offscreen.height; y++) {
            for (let x = 0; x < offscreen.width; x++) {
                const idx = (y * offscreen.width + x) * 4;
                const alpha = imgData[idx + 3];
                if (alpha > 80) {
                    const posX = (x * step) + settings.offset;
                    const posY = y * step;
                    if (posX > -step && posX < V_WIDTH) {
                        const r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2];
                        const mr = maskData[idx], mb = maskData[idx+2], mg = maskData[idx+1];
                        const isText = (mr > 200 && mb > 200 && mg < 50) && (Math.abs(r-g) < 15 && Math.abs(g-b) < 15);
                        ctx.fillStyle = isText ? `rgba(${targetColor.r}, ${targetColor.g}, ${targetColor.b}, ${alpha/255})` : `rgba(${r}, ${g}, ${b}, ${alpha/255})`;
                        ctx.beginPath();
                        ctx.arc(posX + step/2, posY + step/2, dotSize/2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }
        settings.offset -= settings.speed;
        if (settings.offset < -(offscreen.width * step)) settings.offset = V_WIDTH;
        requestAnimationFrame(draw);
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
    }

    function toggleRecording() {
        if (!isRecording) {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(canvas.captureStream(30), { mimeType: 'video/mp4', videoBitsPerSecond: 8000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = exportVideo;
            mediaRecorder.start();
            isRecording = true;
            recordBtn.innerText = "停止"; recordBtn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "錄影"; recordBtn.classList.remove('recording');
        }
    }

    function exportVideo() {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        manualBtn.onclick = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = `白六_LED_Banner.mp4`;
            a.click();
        };
        overlay.style.display = 'flex';
    }

    function closeModal() { overlay.style.display = 'none'; }
    window.addEventListener('resize', renderBuffer);
    renderBuffer(); draw();
</script>
</body>
</html>
