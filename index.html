<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LED Banner - Pro Emoji Fix</title>
    <style>
        :root { --bg-color: #000; --panel-bg: #1a1a1a; --accent-blue: #007AFF; --accent-red: #ff3b30; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #fff; }
        body { display: flex; flex-direction: column; }
        #display-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        canvas { aspect-ratio: 16 / 9; width: 100% !important; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
        #download-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #222; padding: 25px; border-radius: 15px; text-align: center; max-width: 300px; border: 1px solid #444; }
        #controls { background: var(--panel-bg); padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; }
        @media (orientation: landscape) { #controls { display: none; } }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; font-size: 16px; }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: var(--accent-blue); color: white; font-weight: 600; cursor: pointer; }
        #recordBtn { background: var(--accent-red); min-width: 80px; }
        #recordBtn.recording { animation: pulse 1s infinite; background: #900; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 15px; font-size: 12px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: var(--accent-blue); }
    </style>
</head>
<body>

<div id="display-container">
    <canvas id="ledCanvas"></canvas>
    <div id="download-overlay">
        <div class="modal">
            <h3 style="margin-top:0;">16:9 錄製完成</h3>
            <button id="manualDownloadBtn" style="width:100%; margin-bottom:10px; background:#34c759;">下載影片 (MP4)</button>
            <button onclick="closeModal()" style="background:none; color:#888; text-decoration:underline;">關閉</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="input-row">
        <input type="text" id="textInput" value="早安 星期天 ❤️ 🚁 🐩">
        <button onclick="updateText()">更新</button>
        <button id="recordBtn" onclick="toggleRecording()">錄影</button>
    </div>
    <div class="settings-grid">
        <div style="display:flex; flex-direction:column; gap:4px;"><label>滾動速度</label><input type="range" id="speedRange" min="0" max="40" value="20" oninput="updateSettings()"></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label>點陣密度</label><input type="range" id="pixelRange" min="40" max="120" value="70" oninput="updateSettings()"></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label>文字顏色</label><input type="color" id="colorPicker" value="#00ff00" onchange="updateSettings()" style="width:100%; border:none; background:none; height:25px;"></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label>燈珠大小</label><input type="range" id="sizeRange" min="0.2" max="1" step="0.05" value="0.75" oninput="updateSettings()"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('ledCanvas'), ctx = canvas.getContext('2d', { alpha: false });
    const textInput = document.getElementById('textInput'), recordBtn = document.getElementById('recordBtn');
    const overlay = document.getElementById('download-overlay'), manualBtn = document.getElementById('manualDownloadBtn');

    const V_WIDTH = 1280, V_HEIGHT = 720;
    let settings = { text: textInput.value, density: 70, dotScale: 0.75, color: "#00ff00", speed: 20, offset: V_WIDTH };
    
    // 雙離屏畫布：一個用於原始彩色，一個用於偵測文字
    const offscreen = document.createElement('canvas'), octx = offscreen.getContext('2d');
    const maskCanvas = document.createElement('canvas'), mctx = maskCanvas.getContext('2d');
    
    let mediaRecorder, recordedChunks = [], isRecording = false;

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
    }

    function updateSettings() {
        settings.speed = parseInt(document.getElementById('speedRange').value);
        settings.density = parseInt(document.getElementById('pixelRange').value);
        settings.dotScale = parseFloat(document.getElementById('sizeRange').value);
        settings.color = document.getElementById('colorPicker').value;
        renderBuffer();
    }

    function updateText() { settings.text = textInput.value; renderBuffer(); settings.offset = V_WIDTH; }

    function renderBuffer() {
        const fontSize = settings.density * 0.85; 
        octx.font = `bold ${fontSize}px sans-serif`;
        const metrics = octx.measureText(settings.text);
        const w = metrics.width + 200, h = settings.density;
        
        offscreen.width = maskCanvas.width = w;
        offscreen.height = maskCanvas.height = h;

        // 第一個畫布：正常繪製（Emoji 與文字都是原始色彩）
        octx.clearRect(0, 0, w, h);
        octx.textBaseline = "middle";
        octx.font = `bold ${fontSize}px sans-serif`;
        octx.fillStyle = "white"; // 文字先用白色，Emoji 維持原色
        octx.fillText(settings.text, 50, h / 2);

        // 第二個畫布：遮罩繪製（用來區分文字與 Emoji）
        // 大部分的 Emoji 不會被這層 Canvas 改變顏色，我們用它來偵測
        mctx.clearRect(0, 0, w, h);
        mctx.textBaseline = "middle";
        mctx.font = `bold ${fontSize}px sans-serif`;
        mctx.fillStyle = "#FF00FF"; // 螢光桃紅作為識別標記
        mctx.fillText(settings.text, 50, h / 2);

        canvas.width = V_WIDTH; canvas.height = V_HEIGHT; 
    }

    function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const imgData = octx.getImageData(0, 0, offscreen.width, offscreen.height).data;
        const maskData = mctx.getImageData(0, 0, maskCanvas.width, maskCanvas.height).data;
        
        const step = V_HEIGHT / settings.density;
        const dotSize = step * settings.dotScale;
        const targetColor = hexToRgb(settings.color);

        for (let y = 0; y < offscreen.height; y++) {
            for (let x = 0; x < offscreen.width; x++) {
                const idx = (y * offscreen.width + x) * 4;
                if (imgData[idx + 3] > 80) {
                    const posX = (x * step) + settings.offset;
                    const posY = y * step;
                    
                    if (posX > -step && posX < V_WIDTH) {
                        const r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2];
                        const mr = maskData[idx], mg = maskData[idx+1], mb = maskData[idx+2];
                        
                        // 核心判斷：
                        // 如果在遮罩層是桃紅色 (#FF00FF)，且在原始層是白色 (文字)
                        // 且兩者 R 與 B 數值同步（代表灰階文字），則變色
                        const isText = (mr > 200 && mb > 200 && mg < 50) && (Math.abs(r-g) < 10 && Math.abs(g-b) < 10);

                        if (isText) {
                            ctx.fillStyle = `rgba(${targetColor.r}, ${targetColor.g}, ${targetColor.b}, ${imgData[idx+3]/255})`;
                        } else {
                            // 保留 Emoji 原始色彩（含白色部分）
                            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${imgData[idx+3]/255})`;
                        }
                        
                        ctx.beginPath();
                        ctx.arc(posX + step/2, posY + step/2, dotSize/2, 0, Math.PI * 2);
                        ctx.fill();

                        // LED 背光點綴
                        if ((r+g+b)/3 > 150) {
                            ctx.fillStyle = "rgba(255,255,255,0.2)";
                            ctx.beginPath();
                            ctx.arc(posX + step/2, posY + step/2, dotSize/4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
        }
        settings.offset -= settings.speed;
        if (settings.offset < -(offscreen.width * step)) settings.offset = V_WIDTH;
        requestAnimationFrame(draw);
    }

    function toggleRecording() {
        if (!isRecording) {
            recordedChunks = [];
            const stream = canvas.captureStream(30);
            const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
            mediaRecorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 6000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = exportVideo;
            mediaRecorder.start();
            isRecording = true;
            recordBtn.innerText = "停止"; recordBtn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "錄影"; recordBtn.classList.remove('recording');
        }
    }

    function exportVideo() {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const triggerDownload = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = `LED_PerfectEmoji_16-9.mp4`;
            a.click();
        };
        triggerDownload();
        manualBtn.onclick = triggerDownload;
        overlay.style.display = 'flex';
    }

    function closeModal() { overlay.style.display = 'none'; }
    window.addEventListener('resize', renderBuffer);
    renderBuffer(); settings.offset = V_WIDTH; draw();
</script>
</body>
</html>
