<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>index3 - 旗艦字體全開版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Potta+One&family=Zhi+Mang+Xing&family=Kosugi+Maru&family=Noto+Serif+JP:wght@900&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #000; --panel-bg: #1a1a1a; --accent-blue: #007AFF; --accent-red: #ff3b30; --accent-green: #34c759; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang TC", sans-serif; color: #fff; }
        body { display: flex; flex-direction: column; }
        #display-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #000; }
        canvas { aspect-ratio: 16 / 9; width: 100% !important; max-height: 100%; object-fit: contain; image-rendering: pixelated; border: 1px solid #333; }
        #download-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #222; padding: 30px; border-radius: 20px; text-align: center; max-width: 320px; border: 1px solid #444; }
        #controls { background: var(--panel-bg); padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; overflow-y: auto; max-height: 50%; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"], select { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: white; font-size: 16px; outline: none; }
        .btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--accent-blue); color: white; font-weight: 600; cursor: pointer; font-size: 14px; }
        #recordBtn { background: var(--accent-red); min-width: 120px; }
        .recording { animation: pulse 1s infinite; background: #900 !important; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 15px; font-size: 11px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: var(--accent-blue); }
        #font-loader { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="font-loader">
    <span style="font-family: 'Potta One';">P</span>
    <span style="font-family: 'Zhi Mang Xing';">Z</span>
    <span style="font-family: 'Kosugi Maru';">K</span>
    <span style="font-family: 'Noto Serif JP';">N</span>
    <span style="font-family: 'Noto Sans TC';">T</span>
</div>

<div id="display-container">
    <canvas id="ledCanvas"></canvas>
    <div id="download-overlay">
        <div class="modal">
            <h2 style="color:var(--accent-green);">製作完成</h2>
            <button id="manualDownloadBtn" class="btn" style="width:100%; margin-bottom:12px; background:var(--accent-green); height:50px;">下載影片</button>
            <button onclick="closeModal()" style="background:none; color:#666; border:none;">關閉</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="input-row">
        <input type="text" id="textInput" value="白六 LED 跑馬燈 ❤️ 🚁">
        <select id="fontSelect" onchange="changeFont()">
            <option value="'Potta One', cursive">日式布丁 (推薦)</option>
            <option value="'Noto Serif JP', serif">日式明體 (宋體)</option>
            <option value="'Zhi Mang Xing', cursive">本墨草書 (毛筆)</option>
            <option value="'Kosugi Maru', sans-serif">日式圓體</option>
            <option value="'Noto Sans TC', sans-serif">Noto 極黑</option>
            <option value="'PingFang TC', sans-serif">預設黑體</option>
        </select>
        <button class="btn" onclick="updateText()">更新</button>
    </div>

    <div style="background: rgba(255,255,255,0.05); padding:10px; border-radius:12px;">
        <div class="input-row" style="margin-bottom:8px;">
            <label class="btn" style="flex:1; background:#333; text-align:center;">左側圖示<input type="file" id="imageInput" accept="image/*" hidden onchange="handleImage(this)"></label>
            <button id="recordBtn" class="btn" onclick="startAutoRecording()">錄製合體影片</button>
        </div>
        <div class="settings-grid">
            <div style="display:flex;flex-direction:column;"><label>圖片縮放</label><input type="range" id="imgScale" min="0.5" max="2" step="0.05" value="1.0" oninput="updateSettings()"></div>
            <div style="display:flex;flex-direction:column;"><label>圖片位置 (Y)</label><input type="range" id="imgY" min="-100" max="100" value="0" oninput="updateSettings()"></div>
        </div>
    </div>

    <div class="settings-grid">
        <div style="display:flex;flex-direction:column;"><label>速度</label><input type="range" id="speedRange" min="5" max="50" value="20" oninput="updateSettings()"></div>
        <div style="display:flex;flex-direction:column;"><label>密度</label><input type="range" id="pixelRange" min="40" max="100" value="65" oninput="updateSettings()"></div>
        <div style="display:flex;flex-direction:column;"><label>顏色</label><input type="color" id="colorPicker" value="#00ff00" onchange="updateSettings()" style="width:100%;height:28px;background:none;border:none;"></div>
        <div style="display:flex;flex-direction:column;"><label>燈珠大小</label><input type="range" id="sizeRange" min="0.2" max="1" step="0.05" value="0.75" oninput="updateSettings()"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('ledCanvas'), ctx = canvas.getContext('2d', { alpha: false });
    const V_WIDTH = 1280, V_HEIGHT = 720;
    const LEFT_W = V_WIDTH / 3;
    
    let settings = { 
        text: "", density: 65, dotScale: 0.75, color: "#00ff00", speed: 20, offset: V_WIDTH - LEFT_W,
        img: null, imgScale: 1.0, imgY: 0, font: "'Potta One', cursive"
    };
    
    const offscreen = document.createElement('canvas'), octx = offscreen.getContext('2d');
    const maskCanvas = document.createElement('canvas'), mctx = maskCanvas.getContext('2d');
    let mediaRecorder, recordedChunks = [], isRecording = false;

    async function changeFont() {
        const selectedFont = document.getElementById('fontSelect').value;
        settings.font = selectedFont;
        
        let count = 0;
        const forceUpdate = setInterval(() => {
            renderBuffer();
            if (count++ > 5) clearInterval(forceUpdate);
        }, 300);
        
        try { await document.fonts.load(`16px ${selectedFont}`, settings.text); } catch(e){}
    }

    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => { settings.img = img; renderBuffer(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function updateSettings() {
        settings.speed = parseInt(document.getElementById('speedRange').value);
        settings.density = parseInt(document.getElementById('pixelRange').value);
        settings.dotScale = parseFloat(document.getElementById('sizeRange').value);
        settings.color = document.getElementById('colorPicker').value;
        settings.imgScale = parseFloat(document.getElementById('imgScale').value);
        settings.imgY = parseInt(document.getElementById('imgY').value);
        renderBuffer();
    }

    function updateText() { settings.text = document.getElementById('textInput').value; changeFont(); }

    function renderBuffer() {
        const h = settings.density;
        const weight = settings.font.includes('Noto') ? '900' : 'normal';
        const fontStr = `${weight} ${h * 0.82}px ${settings.font}`;
        octx.font = mctx.font = fontStr;
        
        let textMetrics = octx.measureText(settings.text);
        let contentWidth = textMetrics.width + 300;
        
        offscreen.width = maskCanvas.width = contentWidth;
        offscreen.height = maskCanvas.height = h;

        octx.clearRect(0, 0, contentWidth, h);
        mctx.clearRect(0, 0, contentWidth, h);
        octx.font = mctx.font = fontStr; 
        octx.textBaseline = mctx.textBaseline = "middle";
        
        octx.fillStyle = "white"; octx.fillText(settings.text, 50, h / 2);
        mctx.fillStyle = "#FF00FF"; mctx.fillText(settings.text, 50, h / 2);
        canvas.width = V_WIDTH; canvas.height = V_HEIGHT; 
    }

    function draw() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        const step = V_HEIGHT / settings.density, dotS = step * settings.dotScale;
        const targetColor = hexToRgb(settings.color);

        if (settings.img) {
            const aspect = settings.img.width / settings.img.height;
            const drawW = LEFT_W * settings.imgScale;
            const drawH = drawW / aspect;
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, LEFT_W, V_HEIGHT); ctx.clip();
            ctx.drawImage(settings.img, (LEFT_W - drawW)/2, (V_HEIGHT - drawH)/2 + settings.imgY, drawW, drawH);
            ctx.restore();
        }
        
        ctx.fillStyle = "#111"; ctx.fillRect(LEFT_W - 1, 0, 2, V_HEIGHT);

        const imgD = octx.getImageData(0, 0, offscreen.width, offscreen.height).data;
        const maskD = mctx.getImageData(0, 0, maskCanvas.width, maskCanvas.height).data;

        for (let y = 0; y < offscreen.height; y++) {
            for (let x = 0; x < offscreen.width; x++) {
                const i = (y * offscreen.width + x) * 4;
                const alpha = imgD[i + 3];
                if (alpha > 20) { 
                    const px = (x * step) + settings.offset + LEFT_W, py = y * step;
                    if (px >= LEFT_W && px < V_WIDTH) {
                        const r = imgD[i], g = imgD[i+1], b = imgD[i+2];
                        const isT = (maskD[i] > 200 && maskD[i+2] > 200 && maskD[i+1] < 50);
                        const aVal = alpha / 255;
                        ctx.fillStyle = isT ? `rgba(${targetColor.r},${targetColor.g},${targetColor.b},${aVal})` : `rgba(${r},${g},${b},${aVal})`;
                        ctx.beginPath(); ctx.arc(px + step/2, py + step/2, dotS/2, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }
        }

        settings.offset -= settings.speed;
        if (isRecording && settings.offset < -(offscreen.width * step)) stopRecording();
        if (settings.offset < -(offscreen.width * step)) settings.offset = V_WIDTH - LEFT_W;
        requestAnimationFrame(draw);
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
    }

    function startAutoRecording() {
        if (isRecording) return;
        settings.offset = V_WIDTH - LEFT_W;
        recordedChunks = [];
        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4', videoBitsPerSecond: 8000000 });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = exportVideo;
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordBtn').classList.add('recording');
    }

    function stopRecording() { if (isRecording) { mediaRecorder.stop(); isRecording = false; document.getElementById('recordBtn').classList.remove('recording'); } }
    function exportVideo() {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        document.getElementById('manualDownloadBtn').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = `LED_Banner_Final.mp4`; a.click(); };
        document.getElementById('download-overlay').style.display = 'flex';
    }
    function closeModal() { document.getElementById('download-overlay').style.display = 'none'; }

    updateText(); draw();
</script>
</body>
</html>
